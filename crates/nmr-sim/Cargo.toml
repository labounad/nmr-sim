[package]
name = "nmr-sim"
description = "Fast open-source spin dynamics simulation for NMR and beyond"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
# Complex numbers. `num-complex` is the de-facto standard and is what nalgebra
# uses internally for its complex matrix types.
num-complex = "0.4"

# Dense linear algebra. We use nalgebra for matrices (`DMatrix<Complex<f64>>`)
# and will add `nalgebra-lapack` later for fast Hermitian eigendecomposition.
# For now, default features are enough — we only need allocation + basic ops.
nalgebra = "0.33"

# Future deps (kept as comments so we remember the plan):
# - nalgebra-lapack     # complex Hermitian eigendecomposition (needs system BLAS)
# - rayon               # parallelism for powder-average / ensemble sampling

[dev-dependencies]
# `approx` lets us write assert_relative_eq!(a, b, epsilon = 1e-10) instead
# of open-coding `(a - b).abs() < 1e-10` everywhere. Worth it once we're
# comparing matrix elements.
approx = "0.5"
